name: GitHub Profile Summary Cards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-profile-summary-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Generate GitHub Profile Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ceschiavolim
          BRANCH_NAME: master
          THEME: nord_dark
          TIME_ZONE: America/Sao_Paulo
          AUTO_PUSH: false

      - name: Verify generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            0-profile-details.svg \
            1-repos-per-language.svg \
            2-most-commit-language.svg \
            3-stats.svg \
            4-productive-time.svg; do
            test -s "profile-summary-card-output/nord_dark/$file"
          done

      - name: Create pull request for updated cards
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: automation/profile-summary-cards
          delete-branch: true
          add-paths: profile-summary-card-output/nord_dark/**
          commit-message: 'chore: update GitHub profile statistics'
          title: 'chore: update GitHub profile statistics'
          body: 'Atualização automática dos gráficos do perfil GitHub no tema nord_dark.'
