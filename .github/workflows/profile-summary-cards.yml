name: GitHub Profile Summary Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Generate GitHub Profile Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ceschiavolim
          BRANCH_NAME: main
          THEME: nord_dark
          TIME_ZONE: America/Sao_Paulo
          AUTO_PUSH: false

      - name: Verify generated files
        run: |
          echo "=== Generated SVG files ==="
          find profile-summary-card-output/nord_dark \
            -maxdepth 1 -name "*.svg" -type f -print

          echo "=== Git status ==="
          git status --short

      - name: Commit and push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/nord_dark/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile statistics"

          echo "=== Publishing cards ==="
          git push origin HEAD:main
