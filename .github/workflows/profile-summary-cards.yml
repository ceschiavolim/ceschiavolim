name: GitHub Profile Summary Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/github-profile-nord-dark
          persist-credentials: true

      - name: Generate GitHub Profile Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ceschiavolim
          BRANCH_NAME: feat/github-profile-nord-dark
          THEME: nord_dark
          TIME_ZONE: America/Sao_Paulo
          AUTO_PUSH: false

      - name: Diagnose generated files
        run: |
          echo "=== Branch ==="
          git branch --show-current

          echo "=== Git status ==="
          git status --short

          echo "=== Generated files ==="
          find profile-summary-card-output -type f | head -30

          echo "=== Remote ==="
          git remote -v